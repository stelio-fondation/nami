<!doctype html>
<meta charset="utf-8" />
<title>Nami</title>
<!-- The tab bar of a tabbed window (src/main/workspace-shell.js). It wears the
     same theme tokens as the desk below it, so it loads the same sheets. -->
<link rel="stylesheet" href="./paper.css" />
<link rel="stylesheet" href="./theme-operator.css" />
<link rel="stylesheet" href="./theme-glass.css" />
<link rel="stylesheet" href="./theme-graphite.css" />
<link rel="stylesheet" href="./theme-soft.css" />
<link rel="stylesheet" href="./theme-dusk.css" />
<link rel="stylesheet" href="./tabbar.css" />
<body class="tabbar-page">
  <div class="tabbar" id="tabbar" role="tablist" aria-label="Workspaces">
    <div class="tabbar-tabs" id="tabs"></div>
    <button class="tabbar-new" id="new" title="New Tab" aria-label="New Tab">+</button>
    <div class="tabbar-fill"></div>
  </div>
  <script src="./tabbar.js"></script>
</body>
